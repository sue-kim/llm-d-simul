# BLIS v0.12.0 pd.yaml with the supported inflight-load.yaml scoring mix.
# Count dispatched requests before engine admission: prefill counts remain until
# the first response chunk; decode counts remain until the response completes.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
  - type: approx-prefix-cache-producer
    parameters:
      maxPrefixTokensToMatch: 16384
      lruCapacityPerServer: 31250
  - type: inflight-load-producer
  - type: active-request-scorer
  - type: prefix-cache-scorer
  - type: queue-scorer
  - type: kv-cache-utilization-scorer
  - type: prefill-filter
  - type: decode-filter
  - type: max-score-picker
  - type: always-disagg-pd-decider
  - type: disagg-profile-handler
    parameters:
      deciders:
        prefill: always-disagg-pd-decider
schedulingProfiles:
  - name: prefill
    plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
      - pluginRef: kv-cache-utilization-scorer
        weight: 1
      - pluginRef: prefix-cache-scorer
        weight: 1
  - name: decode
    plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
      - pluginRef: kv-cache-utilization-scorer
        weight: 1
      - pluginRef: prefix-cache-scorer
        weight: 1
