# Same disaggregation handler and pool filters as llmd-pd-router.yaml.
# Endpoint selection within each pool is random.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
  - type: prefill-filter
  - type: decode-filter
  - type: random-picker
  - type: always-disagg-pd-decider
  - type: disagg-profile-handler
    parameters:
      deciders:
        prefill: always-disagg-pd-decider
schedulingProfiles:
  - name: prefill
    plugins:
      - pluginRef: prefill-filter
      - pluginRef: random-picker
  - name: decode
    plugins:
      - pluginRef: decode-filter
      - pluginRef: random-picker
